<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Ticket Generation</title>

    <link rel="stylesheet" href="styles/style.css">
</head>
<body>
    <main>
        <h1>Generator</h1>
        <p> Enter a message and generate a information ticket</p>

        <section>
            <label for="message-input">Message:</label>
            <textarea id="message-input" placeholder="Type a request here..."></textarea>
            <section class="examples">
                <h2>Example Messages</h2>

                <button class="example-message" data-message="I missed my appointment and changed insurance.">
                    Appointment + Insurance
                </button>

                <button class="example-message" data-message="I need a medication refill soon.">
                    Medication Refill
                </button>

                <button class="example-message" data-message="I have a question about my bill.">
                    Billing Question
                </button>

                <button class="example-message" data-message="My condition is getting worse and I need urgent help.">
                    Urgent Human Review
                </button>
</section>

        <button id="generate-button">Generate Record</button>
        </section>
        <section id="record-output">
            <!-- The generated ticket will appear here -->
            <h2>Ticket Display:</h2>
            <pre id="record-display"></pre>
        </section>

        <button id="copy-json">Copy Latest JSON</button>
    </main>

    <script src="src/app.js"></script>
</body>
</html>
