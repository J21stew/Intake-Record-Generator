<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Ticket Generation</title>

    <link rel="stylesheet" href="styles/style.css">
</head>
<body>
    <main>
        <h1>Generator</h1>
        <p> Enter a message and generate a information ticket</p>

        <section>
            <label for="message-input">Message:</label>
            <textarea id="message-input" placeholder="Type a request here..."></textarea>

            <button id="generate-button">Generate Record</button>
        </section>
        <section id="record-output">
            <!-- The generated ticket will appear here -->
            <h2>Ticket Display:</h2>
            <pre id="record-display"></pre>
        </section>
    </main>

    <script src="src/app.js"></script>
</body>
</html>
